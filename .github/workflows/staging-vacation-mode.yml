name: Staging vacation mode

on:
  workflow_dispatch:
    inputs:
      action:
        description: Turn the staging API off, turn it on, or inspect its current state
        required: true
        default: status
        type: choice
        options:
          - status
          - off
          - on

concurrency:
  group: staging-vacation-mode
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: '908027418886'
  AWS_REGION: ap-south-1
  LAMBDA_FUNCTION: dear-diary-sync-staging
  WARMUP_BOOTSTRAP_SCHEDULE: dear-diary-staging-warmup-bootstrap
  WARMUP_KEEPALIVE_SCHEDULE: dear-diary-staging-warmup-keepalive

jobs:
  control:
    name: ${{ inputs.action }} staging API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Validate deployment role
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "Repository environment variable AWS_DEPLOY_ROLE_ARN is required." >&2
            exit 1
          fi

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: staging-vacation-${{ github.run_id }}

      - name: Turn staging off
        if: inputs.action == 'off'
        shell: bash
        run: |
          set -euo pipefail

          set_warmup_state() {
            local name="$1"
            local state="$2"
            local schedule target flexible expression timezone
            schedule=$(aws scheduler get-schedule --name "$name" --output json)
            target=$(jq -c '.Target' <<< "$schedule")
            flexible=$(jq -c '.FlexibleTimeWindow' <<< "$schedule")
            expression=$(jq -r '.ScheduleExpression' <<< "$schedule")
            timezone=$(jq -r '.ScheduleExpressionTimezone' <<< "$schedule")
            aws scheduler update-schedule \
              --name "$name" \
              --description "$(jq -r '.Description' <<< "$schedule")" \
              --schedule-expression "$expression" \
              --schedule-expression-timezone "$timezone" \
              --flexible-time-window "$flexible" \
              --target "$target" \
              --state "$state" \
              --action-after-completion NONE \
              --query 'State' \
              --output text
          }

          set_warmup_state "$WARMUP_BOOTSTRAP_SCHEDULE" DISABLED
          set_warmup_state "$WARMUP_KEEPALIVE_SCHEDULE" DISABLED
          aws lambda update-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --auth-type AWS_IAM \
            --query 'FunctionUrl' \
            --output text
          aws lambda put-function-concurrency \
            --function-name "$LAMBDA_FUNCTION" \
            --reserved-concurrent-executions 0 \
            --query 'ReservedConcurrentExecutions' \
            --output text

          function_url=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'FunctionUrl' \
            --output text)
          status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "${function_url}actuator/health")
          if [[ "$status" != "403" ]]; then
            echo "Vacation mode expected the public endpoint to return 403; got $status." >&2
            exit 1
          fi

      - name: Turn staging on
        if: inputs.action == 'on'
        shell: bash
        run: |
          set -euo pipefail

          set_warmup_state() {
            local name="$1"
            local state="$2"
            local schedule target flexible expression timezone
            schedule=$(aws scheduler get-schedule --name "$name" --output json)
            target=$(jq -c '.Target' <<< "$schedule")
            flexible=$(jq -c '.FlexibleTimeWindow' <<< "$schedule")
            expression=$(jq -r '.ScheduleExpression' <<< "$schedule")
            timezone=$(jq -r '.ScheduleExpressionTimezone' <<< "$schedule")
            aws scheduler update-schedule \
              --name "$name" \
              --description "$(jq -r '.Description' <<< "$schedule")" \
              --schedule-expression "$expression" \
              --schedule-expression-timezone "$timezone" \
              --flexible-time-window "$flexible" \
              --target "$target" \
              --state "$state" \
              --action-after-completion NONE \
              --query 'State' \
              --output text
          }

          if ! error=$(aws lambda delete-function-concurrency \
            --function-name "$LAMBDA_FUNCTION" 2>&1); then
            if [[ "$error" != *ResourceNotFoundException* ]]; then
              echo "$error" >&2
              exit 1
            fi
          fi
          aws lambda update-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --auth-type NONE \
            --query 'FunctionUrl' \
            --output text

          set_warmup_state "$WARMUP_BOOTSTRAP_SCHEDULE" ENABLED
          set_warmup_state "$WARMUP_KEEPALIVE_SCHEDULE" ENABLED

          function_url=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'FunctionUrl' \
            --output text)
          health=$(curl --fail --silent --show-error \
            --max-time 70 \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${function_url}actuator/health")
          jq -e '.status == "UP"' <<< "$health" >/dev/null

      - name: Report staging state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          auth_type=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'AuthType' \
            --output text)
          reserved=$(aws lambda get-function-concurrency \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'ReservedConcurrentExecutions' \
            --output text)
          if [[ -z "$reserved" || "$reserved" == "None" ]]; then
            reserved=unreserved
          fi
          bootstrap_state=$(aws scheduler get-schedule \
            --name "$WARMUP_BOOTSTRAP_SCHEDULE" \
            --query 'State' \
            --output text)
          keepalive_state=$(aws scheduler get-schedule \
            --name "$WARMUP_KEEPALIVE_SCHEDULE" \
            --query 'State' \
            --output text)

          if [[ "$auth_type" == "AWS_IAM" && "$reserved" == "0" && \
                "$bootstrap_state" == "DISABLED" && "$keepalive_state" == "DISABLED" ]]; then
            mode=OFF
          elif [[ "$auth_type" == "NONE" && "$reserved" == "unreserved" && \
                  "$bootstrap_state" == "ENABLED" && "$keepalive_state" == "ENABLED" ]]; then
            mode=ON
          else
            mode=INCONSISTENT
          fi

          {
            echo "## Staging vacation mode"
            echo
            echo "- Requested action: \`${{ inputs.action }}\`"
            echo "- Mode: \`$mode\`"
            echo "- Function URL authentication: \`$auth_type\`"
            echo "- Reserved concurrency: \`$reserved\`"
            echo "- Bootstrap warm-up: \`$bootstrap_state\`"
            echo "- Keep-alive warm-up: \`$keepalive_state\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$mode" == "INCONSISTENT" ]]; then
            echo "Staging has a partial vacation-mode configuration." >&2
            exit 1
          fi
