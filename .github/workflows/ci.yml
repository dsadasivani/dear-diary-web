name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      browser: ${{ steps.scope.outputs.browser }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-ci-scope.mjs "$BASE_SHA" "$HEAD_SHA"

  repository-guards:
    name: Repository guards
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/detect-ci-scope.test.mjs
      - run: node scripts/validate-ops-config.mjs
      - run: node scripts/secret-and-artifact-scan.mjs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm run backend:test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:v2-client
      - run: npm run test:storage
      - run: npm run test:component
      - run: npm run test:server
      - run: npm run build
      - run: npm audit --audit-level=high

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run functional, visual, and accessibility tests
        run: npm run test:e2e
        env:
          HOME: /root

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            script: android:test
          - name: lint
            script: android:lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Ensure the required Android SDK is available
        shell: bash
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi
      - run: npm ci
      - run: npm run build
      - run: npx --no-install cap sync android
      - run: npm run ${{ matrix.script }}

  required:
    name: CI passed
    if: always()
    needs: [changes, repository-guards, backend, web, browser, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected CI jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GUARDS_RESULT: ${{ needs.repository-guards.result }}
          BACKEND_EXPECTED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WEB_EXPECTED: ${{ needs.changes.outputs.web }}
          WEB_RESULT: ${{ needs.web.result }}
          BROWSER_EXPECTED: ${{ needs.changes.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ANDROID_EXPECTED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" || "$GUARDS_RESULT" != "success" ]]; then
            echo "CI scope detection or repository guards failed." >&2
            exit 1
          fi

          require_selected() {
            local name="$1"
            local expected="$2"
            local result="$3"
            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but ended with result: $result" >&2
              exit 1
            fi
            if [[ "$expected" != "true" && "$result" != "skipped" && "$result" != "success" ]]; then
              echo "$name was not selected but ended unexpectedly with result: $result" >&2
              exit 1
            fi
          }

          require_selected backend "$BACKEND_EXPECTED" "$BACKEND_RESULT"
          require_selected web "$WEB_EXPECTED" "$WEB_RESULT"
          require_selected browser "$BROWSER_EXPECTED" "$BROWSER_RESULT"
          require_selected android "$ANDROID_EXPECTED" "$ANDROID_RESULT"
