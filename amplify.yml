version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - export VITE_TELEMETRY_RELEASE_VERSION="${AWS_COMMIT_ID:-staging}"
        - npm run build:web:release:staging
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
