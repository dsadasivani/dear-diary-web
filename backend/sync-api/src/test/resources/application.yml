spring:
  datasource:
    url: jdbc:h2:mem:sync-api-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  flyway:
    enabled: false
management:
  tracing:
    enabled: false
  otlp:
    logging:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
  health:
    defaults:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
sync:
  observability:
    prometheus-public-enabled: true
