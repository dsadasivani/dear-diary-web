groups:
  - name: dear-diary-integrity-critical
    rules:
      - alert: SyncHashMismatch
        expr: sum by (environment) (increase(sync_api_error_total{error_code="HASH_MISMATCH"}[5m])) > 0
        for: 0m
        labels: { severity: critical }
        annotations: { summary: 'Encrypted sync object hash mismatch detected' }
      - alert: SyncSequenceRegression
        expr: sum by (environment) (increase(sync_api_error_total{error_code=~"SEQUENCE_GAP|CURSOR_REGRESSION|SNAPSHOT_SEQUENCE_STALE"}[5m])) > 0
        labels: { severity: critical }
        annotations: { summary: 'A sequence or cursor integrity violation was detected' }
      - alert: SyncCommittedObjectMissing
        expr: sum by (environment) (increase(sync_api_error_total{error_code="OBJECT_MISSING"}[5m])) > 0
        labels: { severity: critical }
        annotations: { summary: 'Committed encrypted object is missing' }
      - alert: SyncDatabaseCorruption
        expr: sum by (environment) (increase(sync_database_corruption_total[5m])) > 0
        labels: { severity: critical }
        annotations: { summary: 'Database corruption was detected' }
  - name: dear-diary-operational
    rules:
      - alert: SyncApiUnavailable
        expr: absent_over_time(process_uptime_seconds{application="dear-diary-sync-api",environment="staging"}[5m])
        for: 2m
        labels: { severity: critical }
        annotations: { summary: 'The Sync API stopped sending metrics to Grafana Cloud' }
      - alert: SyncCommitSuccessRateLow
        expr: (sum by (environment) (rate(sync_operation_commit_total{outcome="success"}[15m])) / clamp_min(sum by (environment) (rate(sync_operation_commit_total[15m])), 0.001) < 0.99) and (sum by (environment) (rate(sync_operation_commit_total[15m])) > 0.01)
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'Sync commit success rate is below 99%' }
      - alert: SyncHttpServerErrorRateHigh
        expr: (sum by (environment) (rate(http_server_requests_seconds_count{status=~"5.."}[10m])) / clamp_min(sum by (environment) (rate(http_server_requests_seconds_count[10m])), 0.001) > 0.01) and (sum by (environment) (rate(http_server_requests_seconds_count[10m])) > 0.01)
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'Sync API HTTP 5xx rate is above 1%' }
      - alert: SyncNotificationBacklog
        expr: sync_notification_outbox_depth > 1000
        for: 15m
        labels: { severity: warning }
      - alert: SyncObjectStorageErrors
        expr: rate(sync_object_storage_error_total[5m]) > 0.1
        for: 10m
        labels: { severity: warning }
      - alert: SyncDatabaseTransactionLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(sync_database_transaction_duration_seconds_bucket[10m]))) > 1
        for: 10m
        labels: { severity: warning }
      - alert: SyncAuthenticationFailureSpike
        expr: rate(sync_authentication_failure_total[5m]) > 1
        for: 10m
        labels: { severity: warning }
      - alert: SyncObjectStorageRateLimited
        expr: rate(sync_object_storage_error_total{status="429"}[5m]) > 0.05
        for: 10m
        labels: { severity: warning }
      - alert: SyncObjectStorage5xx
        expr: rate(sync_object_storage_error_total{status=~"5.."}[5m]) > 0.05
        for: 10m
        labels: { severity: warning }
